# Falls back to the color while wallpaper.png doesn't exist
background {
  path = ~/.config/hypr/wallpaper.png
  color = rgb(1e1e2e)
  blur_passes = 2
}

label {
  text = $TIME
  font_size = 120
  color = rgba(ffffffee)
  position = 0, 250
  halign = center
  valign = center
}

label {
  text = cmd[update:60000] date +"%A, %-d %B"
  font_size = 24
  color = rgba(ffffffcc)
  position = 0, 140
  halign = center
  valign = center
}

input-field {
  size = 280, 44
  position = 0, -100
  halign = center
  valign = center
  rounding = 6
  outline_thickness = 1
  outer_color = rgba(ffffff44)
  inner_color = rgba(00000066)
  font_color = rgb(ffffff)
  check_color = rgba(ffffff88)
  fail_color = rgb(d35d6e)
  dots_size = 0.2
  dots_spacing = 0.4
  placeholder_text = Password
  fade_on_empty = false
}

animations {
  animation = inputField, 0
  animation = fade, 1, 2, default
}
