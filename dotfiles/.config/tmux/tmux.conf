set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g focus-events on
set -g base-index 1
set -g renumber-windows on
# tmux 3.8 turned these on by default
set -g mouse off
set -g theme terminal

# Alt hotkeys without prefix. Inside tmux, bash loses its own Alt+t, Alt+n, Alt+p and Alt+digit bindings
bind -n M-t new-window
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# tmux outlives Hyprland restarts, so pick up the new Hyprland instance on attach
set -ga update-environment "HYPRLAND_INSTANCE_SIGNATURE"
